name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/ ./cmd/heimdall
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test extension/test/*.test.js
      - run: npm ci --prefix scripts/browser-test
      - run: node scripts/browser-test/node_modules/typescript/bin/tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --resolveJsonModule extension/test/protocol-types.ts
      - run: node scripts/browser-test/node_modules/playwright/cli.js install --with-deps chromium
        if: runner.os == 'Linux'
      - run: node scripts/browser-verification-smoke.cjs
        if: runner.os == 'Linux'
      - run: node scripts/browser-pairing-smoke.cjs
        if: runner.os == 'Linux'
      - run: node scripts/core-smoke.cjs
      - run: node scripts/native-smoke.cjs
      - run: node scripts/actions-smoke.cjs
      - run: node scripts/continuity-smoke.cjs
      - run: node scripts/resume-smoke.cjs
      - run: node scripts/workspace-smoke.cjs
      - run: node scripts/progress-smoke.cjs
      - run: node scripts/preservation-smoke.cjs
      - run: node scripts/dependency-smoke.cjs
      - run: node scripts/viewport-smoke.cjs
      - run: node scripts/snapshot-smoke.cjs
      - run: node scripts/preview-smoke.cjs
      - run: node scripts/workspace-operation-smoke.cjs
      - run: node scripts/artifact-smoke.cjs
        if: runner.os == 'Linux'
      - run: node scripts/mcp-smoke.cjs
      - run: node scripts/evidence-smoke.cjs
      - run: node scripts/tui-smoke.cjs
