name: Test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/heimdall
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/assets/app.js
      - run: node --test extension/test/*.test.js
      - if: runner.os == 'Windows'
        run: go build -trimpath -o bin/heimdall.exe ./cmd/heimdall
      - if: runner.os == 'Windows'
        run: node scripts/continuity-smoke.cjs
      - if: runner.os == 'Windows'
        run: node scripts/mcp-smoke.cjs
      - if: runner.os == 'Windows'
        run: node scripts/evidence-smoke.cjs
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
        working-directory: web
      - if: runner.os == 'Windows'
        run: node scripts/gui-smoke.cjs
