<svg xmlns="http://www.w3.org/2000/svg" width="680" height="504" viewBox="0 0 680 504" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Observation layer: planned r3 versus live repository</title><desc>Sensor and identity layer compared column by column; legend: teal matches r3, amber renamed/redefined/added, dashed absent.</desc>
<rect x="40" y="40" width="290" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Planned — handoff r3, Sept 5</text>
<rect x="350" y="40" width="290" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="495.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Live — main at 2f11175, Sept 9</text>
<rect x="40" y="100" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="118" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Agent hooks → agent.* events</text>
<text x="185.0" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Claude Code, Codex, transcripts</text>
<rect x="350" y="100" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="495.0" y="118" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Absent</text>
<text x="495.0" y="136" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">no /hook, no conversations</text>
<rect x="40" y="170" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">internal/observe/hyprland</text>
<text x="185.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">socket2, focus spans</text>
<rect x="350" y="170" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="495.0" y="188" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">internal/adapters/hyprland</text>
<text x="495.0" y="206" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">socket2 + epochs, no spans</text>
<rect x="40" y="240" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Extension → surface.* deltas</text>
<text x="185.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">per-container, focus spans</text>
<rect x="350" y="240" width="290" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="495.0" y="258" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Extension → browser.* inventory</text>
<text x="495.0" y="276" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">full-list events + readback</text>
<rect x="40" y="310" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">internal/observe/herdr</text>
<text x="185.0" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">observed via HERDR_WORKSPACE_ID</text>
<rect x="350" y="310" width="290" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="495.0" y="328" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">adapters/herdr · bind-herdr</text>
<text x="495.0" y="346" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">declared, then verified</text>
<rect x="40" y="380" width="290" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="185.0" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">surface id = hash(kind|pointer)</text>
<text x="185.0" y="416" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">a tab is a container</text>
<rect x="350" y="380" width="290" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="495.0" y="398" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">DesiredSurface, SurfaceIdentity</text>
<text x="495.0" y="416" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">task-owned manifest slot</text>
<rect x="40" y="456" width="150" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="115.0" y="470.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Matches r3</text>
<rect x="210" y="456" width="270" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.75"/>
<text x="345.0" y="470.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">Renamed, redefined or added</text>
<rect x="500" y="456" width="140" height="28" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="4 3"/>
<text x="570.0" y="470.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Absent</text>
</svg>
