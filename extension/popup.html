<!doctype html><html lang="en"><meta charset="utf-8"><title>Heimdall</title><link rel="stylesheet" href="popup.css"><body><h1>Heimdall</h1><p id="connection">Checking connection…</p><label><input type="checkbox" id="paused"> Pause browser observation and actions</label><p>Profile</p><code id="profile"></code><p id="pair"></p><p id="gap"></p>
<form id="capture"><p>Capture this tab</p><input id="cap-target" placeholder="target (e.g. unassigned or task-id)" value="unassigned"><select id="cap-kind"><option>note</option><option>link</option><option>candidate</option><option>study</option><option>task</option></select><input id="cap-why" placeholder="why"><button type="submit" id="cap-send">Capture</button><p id="cap-status"></p></form>
<small>Observes titles, URLs, and focus of ordinary HTTP(S) tabs after local pairing. Private tabs and page contents are excluded. The local daemon must be running.</small><script type="module" src="popup.js"></script></body></html>
